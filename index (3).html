<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WM Center | Project Expansion Dashboard</title>
<style>
  :root{
    --navy-1:#162447;
    --navy-2:#0f234e;
    --salmon:#FF5757;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    width:100%;
    overflow-x:hidden;
    background: radial-gradient(circle at 50% 42%, var(--navy-2) 0%, var(--navy-1) 75%);
    font-family:'Segoe UI', Arial, Helvetica, sans-serif;
    color:#fff;
  }

  /* ---------- INTRO BLACK OVERLAY ---------- */
  #intro-overlay{
    position:fixed;
    inset:0;
    background:#000;
    z-index:9999;
    opacity:1;
    pointer-events:none;
    transition:opacity 0.6s ease;
  }
  #intro-overlay.hide{ opacity:0; }

  /* ---------- HOME BUTTON ---------- */
  .home-btn{
    position:fixed;
    top:20px;
    right:20px;
    width:46px;
    height:46px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.35);
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:500;
    transition: box-shadow 0.25s ease, background 0.2s ease, transform 0.2s ease;
  }
  .home-btn svg{ width:20px; height:20px; fill:#ffffff; }
  .home-btn:hover{
    background:rgba(255,255,255,0.14);
    box-shadow:0 0 6px rgba(255,87,87,0.6), 0 0 18px rgba(255,87,87,0.45);
    transform:translateY(-2px);
  }
  .home-btn.show{ display:flex; }

  @media (max-width:640px){
    .home-btn{ top:14px; right:14px; width:40px; height:40px; }
    .home-btn svg{ width:17px; height:17px; }
  }

  /* ---------- MAIN WRAPPER ---------- */
  .stage{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    text-align:center;
  }
  .stage-inner{
    position:relative;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- LOGO / TITLE (aset gambar asli hasil crop) ---------- */
  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:56px;
  }
  .brand img{
    width:100%;
    max-width:620px;
    height:auto;
    display:block;
  }

  /* ---------- BUTTON PANEL ---------- */
  .panel{
    position:relative;
    width:100%;
    max-width:1000px;
    min-height:70px;
  }

  .btn-row{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:16px;
  }

  /* image-based pill buttons: no default button chrome */
  .pill-img{
    display:inline-flex;
    background:none;
    border:none;
    padding:0;
    margin:0;
    cursor:pointer;
    line-height:0;
    transition: filter 0.25s ease, transform 0.2s ease;
  }
  .pill-img img{
    display:block;
    height:64px;
    width:auto;
  }
  .pill-img:hover{
    filter: drop-shadow(0 0 4px rgba(255,87,87,0.9)) drop-shadow(0 0 13px rgba(255,87,87,0.55));
    transform:translateY(-2px);
  }

  /* ---------- CONDITION 1 ---------- */
  #condition-1 .pill-img img{ height:62px; }

  /* ---------- CONDITION 2 ---------- */
  #condition-2{ display:none; flex-wrap:wrap; }
  #condition-2 .pill-img img{ height:42px; }

  /* ---------- TRANSITION ANIMATIONS ---------- */
  @keyframes slideOutLeft{
    0%{ transform:translateX(0); opacity:1; }
    100%{ transform:translateX(-140%); opacity:0; }
  }
  @keyframes slideInFromRight{
    0%{ transform:translateX(140%) rotate(6deg); opacity:0; }
    60%{ transform:translateX(-4%) rotate(-1deg); opacity:1; }
    100%{ transform:translateX(0) rotate(0deg); opacity:1; }
  }

  #condition-1.animate-out{ animation: slideOutLeft 0.55s ease forwards; }

  #condition-2.show{ display:flex; }
  #condition-2.show .pill-img{
    opacity:0;
    animation: slideInFromRight 0.6s cubic-bezier(.2,.8,.3,1) forwards;
  }
  #condition-2.show .pill-img:nth-child(1){ animation-delay:0.05s; }
  #condition-2.show .pill-img:nth-child(2){ animation-delay:0.12s; }
  #condition-2.show .pill-img:nth-child(3){ animation-delay:0.19s; }
  #condition-2.show .pill-img:nth-child(4){ animation-delay:0.26s; }
  #condition-2.show .pill-img:nth-child(5){ animation-delay:0.33s; }
  #condition-2.show .pill-img:nth-child(6){ animation-delay:0.40s; }
  #condition-2.show .pill-img:nth-child(7){ animation-delay:0.47s; }
  #condition-2.show .pill-img:nth-child(8){ animation-delay:0.54s; }

  /* ---------- RESPONSIVE / MOBILE ---------- */
  @media (max-width:640px){
    .brand{ margin-bottom:64px; padding:0 10px; }
    .brand img{ max-width:400px; }

    .panel{ min-height:0; }

    /* Kondisi 1 mobile: stack penuh vertikal (sama seperti gambar 2) */
    #condition-1{
      flex-direction:column;
      position:static;
      gap:18px;
      align-items:center;
    }
    #condition-1 .pill-img img{ height:50px; width:auto; }

    /* Kondisi 2 mobile: pill mengikuti lebar gambar & wrap alami (sama seperti gambar 4) */
    #condition-2{
      position:static;
      flex-direction:row;
      flex-wrap:wrap;
      gap:12px;
      max-width:360px;
      margin:0 auto;
    }
    #condition-2 .pill-img img{ height:36px; width:auto; }

    #condition-2.show .pill-img{
      animation:none;
      opacity:1;
      transform:none;
    }
  }
</style>
</head>

<script>
  window.addEventListener('load', function(){
    var overlay = document.getElementById('intro-overlay');
    requestAnimationFrame(function(){
      setTimeout(function(){
        overlay.classList.add('hide');
        setTimeout(function(){ overlay.remove(); }, 650);
      }, 120);
    });
  });

  function showCondition2(){
    var c1 = document.getElementById('condition-1');
    var c2 = document.getElementById('condition-2');
    var home = document.getElementById('homeBtn');

    c1.classList.add('animate-out');

    setTimeout(function(){
      c1.style.display = 'none';
      c2.classList.add('show');
      home.classList.add('show');
    }, 380);
  }

  function showCondition1(){
    var c1 = document.getElementById('condition-1');
    var c2 = document.getElementById('condition-2');
    var home = document.getElementById('homeBtn');

    c2.classList.remove('show');
    home.classList.remove('show');
    c1.classList.remove('animate-out');
    c1.style.display = 'flex';
  }
</script>
