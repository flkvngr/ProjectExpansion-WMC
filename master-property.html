<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WM Center | Master Property</title>
<style>
  :root{
    --navy-1:#162447;
    --navy-2:#0f234e;
    --salmon:#FF5757;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    width:100%;
    overflow-x:hidden;
    background: radial-gradient(circle at 50% 42%, var(--navy-2) 0%, var(--navy-1) 75%);
    font-family:'Segoe UI', Arial, Helvetica, sans-serif;
    color:#fff;
  }

  /* ---------- INTRO BLACK OVERLAY ---------- */
  #intro-overlay{
    position:fixed;
    inset:0;
    background:#000;
    z-index:9999;
    opacity:1;
    pointer-events:none;
    transition:opacity 0.6s ease;
  }
  #intro-overlay.hide{ opacity:0; }

  /* ---------- HOME BUTTON (kembali ke dashboard) ---------- */
  .home-btn{
    position:fixed;
    top:20px;
    right:20px;
    width:46px;
    height:46px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:500;
    text-decoration:none;
    transition: box-shadow 0.25s ease, background 0.2s ease, transform 0.2s ease;
  }
  .home-btn svg{ width:20px; height:20px; fill:#ffffff; }
  .home-btn:hover{
    background:rgba(255,255,255,0.14);
    box-shadow:0 0 6px rgba(255,87,87,0.6), 0 0 18px rgba(255,87,87,0.45);
    transform:translateY(-2px);
  }

  @media (max-width:640px){
    .home-btn{ top:14px; right:14px; width:40px; height:40px; }
    .home-btn svg{ width:17px; height:17px; }
  }

  /* ---------- BACKGROUND GLOW (blur dari logo index) ---------- */
  .bg-glow{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:1100px;
    max-width:160vw;
    pointer-events:none;
    z-index:0;
    filter: blur(48px);
    opacity:0.55;
  }
  .bg-glow img{
    width:100%;
    height:auto;
    display:block;
  }

  @media (max-width:640px){
    .bg-glow{ width:700px; filter: blur(34px); opacity:0.5; }
  }

  /* ---------- MAIN WRAPPER ---------- */
  .stage{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
  }

  .btn-grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(280px, 1fr));
    gap:26px 30px;
    max-width:900px;
  }

  .pill-img{
    display:inline-flex;
    background:none;
    border:none;
    padding:0;
    margin:0;
    cursor:pointer;
    line-height:0;
    text-decoration:none;
    transition: filter 0.25s ease, transform 0.2s ease;
    opacity:0;
    transform:translateY(-70px);
    animation: dropIn 0.65s cubic-bezier(.25,.9,.35,1.15) forwards;
  }
  .pill-img img{
    display:block;
    width:100%;
    height:auto;
  }
  .pill-img:hover{
    filter: drop-shadow(0 0 5px rgba(255,87,87,0.9)) drop-shadow(0 0 16px rgba(255,87,87,0.55));
    transform:translateY(-3px);
  }

  /* ---------- ENTRANCE: gulir dari atas ke bawah, staggered ---------- */
  @keyframes dropIn{
    0%{ opacity:0; transform:translateY(-90px); }
    60%{ opacity:1; transform:translateY(8px); }
    100%{ opacity:1; transform:translateY(0); }
  }

  /* Urutan visual desktop (2x2), pakai grid-column/grid-row eksplisit
     (lebih konsisten lintas browser dibanding 'order'):
     existing(kol1,baris1) | submit-potential(kol2,baris1)
     list-potential(kol1,baris2) | submit-defect(kol2,baris2) */
  .btn-existing{ grid-column:1; grid-row:1; animation-delay:0.15s; }
  .btn-submit-potential{ grid-column:2; grid-row:1; animation-delay:0.30s; }
  .btn-list-potential{ grid-column:1; grid-row:2; animation-delay:0.45s; }
  .btn-submit-defect{ grid-column:2; grid-row:2; animation-delay:0.60s; }

  @media (max-width:640px){
    .btn-grid{
      grid-template-columns:1fr;
      max-width:400px;
      gap:22px;
    }

    /* Mobile: lepas penempatan grid eksplisit, ikuti urutan DOM natural
       (existing, list-potential, submit-potential, submit-defect) sesuai gambar referensi mobile */
    .btn-existing,
    .btn-submit-potential,
    .btn-list-potential,
    .btn-submit-defect{
      grid-column:auto;
      grid-row:auto;
    }
    .btn-existing{ animation-delay:0.15s; }
    .btn-list-potential{ animation-delay:0.30s; }
    .btn-submit-potential{ animation-delay:0.45s; }
    .btn-submit-defect{ animation-delay:0.60s; }
  }
</style>
</head>
