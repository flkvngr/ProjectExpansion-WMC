<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WM Center | Submit Potential Property</title>
<style>
  :root{
    --navy-1:#162447;
    --navy-2:#0f234e;
    --navy-3:#0a1730;
    --salmon:#FF5757;
    --white:#ffffff;
    --slate:#9aa5c4;
    --card:#152244;
    --line:#26355f;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    min-height:100%;
    background: radial-gradient(circle at 50% 20%, var(--navy-2) 0%, var(--navy-1) 60%, var(--navy-3) 100%);
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    color:var(--white);
    overflow-x:hidden;
  }
  a{ color:inherit; }
  #intro-overlay{
    position:fixed; inset:0; background:#000; z-index:9999;
    opacity:1; pointer-events:none; transition:opacity .6s ease;
  }
  #intro-overlay.hide{ opacity:0; }
  .home-btn{
    position:fixed; top:20px; right:20px; width:46px; height:46px; border-radius:50%;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.35);
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:500;
    text-decoration:none; transition:.2s ease;
  }
  .home-btn svg{ width:20px; height:20px; fill:#fff; }
  .home-btn:hover{ box-shadow:0 0 6px rgba(255,87,87,.6), 0 0 18px rgba(255,87,87,.45); transform:translateY(-2px); }

  #page1{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .form-shell{
    width:100%; max-width:1180px;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--line);
    border-radius:20px;
    padding:20px 26px;
    backdrop-filter:blur(6px);
  }
  .form-title{ font-size:20px; font-weight:700; margin-bottom:2px; }
  .nav-link-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(255,255,255,0.05); border:1px solid var(--line); color:var(--white);
    padding:8px 18px; border-radius:20px; font-size:12.5px; text-decoration:none;
    transition:.2s ease; white-space:nowrap;
  }
  .nav-link-btn:hover{ border-color:var(--salmon); box-shadow:0 0 10px rgba(255,87,87,.35); }
  .form-title-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
  .form-sub{ font-size:11.5px; color:var(--slate); margin-top:2px; }
  .form-grid{ display:flex; flex-wrap:wrap; margin:-7px; }
  .form-col{ flex:1 1 300px; padding:7px; box-sizing:border-box; display:flex; flex-direction:column; gap:8px; }
  .field{ display:flex; flex-direction:column; gap:2px; }
  .field label{ font-size:10.5px; color:var(--slate); line-height:1.3; }
  .field label b{ color:var(--salmon); font-weight:700; }
  .field input, .field select, .field textarea{
    background:rgba(255,255,255,0.05);
    border:1px solid var(--line);
    border-radius:7px;
    padding:6px 9px;
    color:var(--white);
    font-size:12.5px;
    font-family:inherit;
    outline:none;
    transition:border-color .15s ease;
  }
  .field textarea{ resize:none; }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--salmon); }
  .field input::placeholder, .field textarea::placeholder{ color:#5b6690; }

  .photo-box{
    border:1.5px dashed var(--line);
    border-radius:10px;
    height:88px;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:4px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    background:rgba(255,255,255,0.03);
  }
  .photo-box:hover{ border-color:var(--salmon); }
  .photo-box img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .photo-box span{ font-size:10.5px; color:var(--slate); text-align:center; padding:0 10px; }
  .photo-box input{ display:none; }

  .submit-row{ display:flex; justify-content:flex-end; align-items:center; gap:12px; margin-top:12px; }
  .btn-submit{
    background:var(--salmon); color:#fff; border:none; border-radius:22px;
    padding:9px 26px; font-size:13px; font-weight:700; cursor:pointer;
    transition:.2s ease;
  }
  .btn-submit:hover{ box-shadow:0 0 14px rgba(255,87,87,.6); transform:translateY(-2px); }
  .btn-submit:disabled{ opacity:.4; cursor:not-allowed; transform:none; box-shadow:none; }

  .modal-bg{
    position:fixed; inset:0; background:rgba(5,10,25,0.75); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:2000;
  }
  .modal-bg.show{ display:flex; }
  .modal-box{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:28px 30px; max-width:380px; text-align:center;
    animation: modalPop .25s cubic-bezier(.25,.9,.35,1.2);
    border-top:3px solid var(--salmon);
  }
  @keyframes modalPop{
    0%{ opacity:0; transform:scale(.92) translateY(6px); }
    100%{ opacity:1; transform:scale(1) translateY(0); }
  }
  .modal-box.success{ border-top-color:#4ADE80; }
  .modal-box.invalid{ border-top-color:#FBBF24; }
  .modal-box.failed{ border-top-color:#FF5757; }
  .modal-box.error{ border-top-color:#F87171; }
  .modal-box .icon{ font-size:34px; margin-bottom:10px; }
  .modal-box h3{ font-size:17px; margin-bottom:8px; }
  .modal-box p{ font-size:13px; color:var(--slate); margin-bottom:18px; line-height:1.5; white-space:pre-line; }
  .modal-box button{
    background:var(--salmon); color:#fff; border:none; border-radius:20px;
    padding:9px 24px; font-size:13px; cursor:pointer; font-weight:700;
  }

  @media (max-width:900px){
    #page1{ align-items:flex-start; padding:70px 14px 30px; }
    .form-col{ flex:1 1 100%; }
  }
</style>
</head>
<body>

<div id="intro-overlay"></div>
<a class="home-btn" href="index.html" aria-label="Kembali ke Home">
  <svg viewBox="0 0 24 24"><path d="M12 3.1 2 12h3v9h6v-6h2v6h6v-9h3L12 3.1zm0 2.69 6 5.4V19h-2v-6H8v6H6v-7.81l6-5.4z"/></svg>
</a>

<section id="page1">
  <div class="form-shell">
    <div class="form-title-row">
      <div>
        <div class="form-title">Submit Potential Property</div>
        <div class="form-sub">Isi data properti kandidat lokasi cabang baru. Field bertanda <b style="color:var(--salmon)">*</b> wajib diisi.</div>
      </div>
      <a class="nav-link-btn" href="masterlist-property.html">📍 Lihat List Property</a>
    </div>

    <div class="form-grid">
      <div class="form-col">
        <div class="field">
          <label>Link GDrive gambar-gambar <b>*</b></label>
          <input type="url" id="f_linkGambar" placeholder="https://drive.google.com/...">
        </div>
        <div class="field">
          <label>Alamat property (secara general) <b>*</b></label>
          <input type="text" id="f_alamat" placeholder="Jl. Contoh No.1">
        </div>
        <div class="field">
          <label>Link alamat (Google Maps) <b>*</b></label>
          <input type="url" id="f_linkMaps" placeholder="https://maps.app.goo.gl/...">
        </div>
        <div class="field">
          <label>Link agent property <b>*</b></label>
          <input type="url" id="f_linkAgent" placeholder="https://...">
        </div>
        <div class="field">
          <label>Skor penilaian (opsional)</label>
          <input type="number" id="f_skor" placeholder="0-100">
        </div>
        <div class="field">
          <label>Short summary <b>*</b></label>
          <textarea id="f_summary" rows="2" placeholder="Ringkasan singkat kondisi/lokasi properti"></textarea>
        </div>
        <div class="field">
          <label>Harga sewa per tahun (angka flat tanpa titik) <b>*</b></label>
          <input type="number" id="f_hargaSewa" placeholder="200000000">
        </div>
      </div>

      <div class="form-col">
        <div class="field">
          <label>Luas tanah dalam m² (opsional)</label>
          <input type="number" id="f_luasTanah" placeholder="150">
        </div>
        <div class="field">
          <label>Lebar bangunan dalam meter (opsional)</label>
          <input type="number" id="f_lebarBangunan" placeholder="8">
        </div>
        <div class="field">
          <label>Panjang bangunan dalam meter (opsional)</label>
          <input type="number" id="f_panjangBangunan" placeholder="16">
        </div>
        <div class="field">
          <label>Total luas bangunan dalam m² (opsional)</label>
          <input type="number" id="f_totalLuasBangunan" placeholder="300">
        </div>
        <div class="field">
          <label>Jumlah lantai (opsional)</label>
          <input type="text" id="f_jumlahLantai" placeholder="2 Lantai">
        </div>
        <div class="field">
          <label>Kondisi bangunan (opsional)</label>
          <input type="text" id="f_kondisiBangunan" placeholder="Baik / renovasi ringan">
        </div>
        <div class="field">
          <label>Contact person agent <b>*</b></label>
          <input type="text" id="f_contactAgent" placeholder="http://wa.me/62812xxxxxx">
        </div>
        <div class="field">
          <label>Deposit (angka flat, opsional)</label>
          <input type="number" id="f_deposit" placeholder="0">
        </div>
      </div>

      <div class="form-col">
        <label class="photo-box" id="photoBox">
          <input type="file" id="f_gambar" accept="image/*">
          <span id="photoBoxText">📷<br>Upload/drag sebuah foto disini</span>
        </label>
        <div class="field">
          <label>Pilih kota <b>*</b></label>
          <select id="f_kota">
            <option value="">Memuat daftar kota...</option>
          </select>
        </div>
        <div class="field">
          <label>Tulis koordinat lokasi (lat, lng) <b>*</b></label>
          <input type="text" id="f_koordinat" placeholder="-6.233723986142425, 106.83198575396864">
        </div>
      </div>
    </div>

    <div class="submit-row">
      <span id="formMsg" style="font-size:12px; color:var(--slate);"></span>
      <button class="btn-submit" id="btnSubmit">Submit Property</button>
    </div>
  </div>
</section>

<div class="modal-bg" id="modalBg">
  <div class="modal-box" id="modalBox">
    <div class="icon" id="modalIcon">✅</div>
    <h3 id="modalTitle">Berhasil</h3>
    <p id="modalText"></p>
    <button onclick="closeModal()">Tutup</button>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = 'PASTE_URL_WEB_APP_APPS_SCRIPT_DI_SINI';

window.addEventListener('load', function(){
  const overlay = document.getElementById('intro-overlay');
  requestAnimationFrame(function(){
    setTimeout(function(){
      overlay.classList.add('hide');
      setTimeout(function(){ overlay.remove(); }, 650);
    }, 120);
  });
  loadCityDropdown();
});

const MODAL_PRESET = {
  success: { icon: '✅' },
  invalid: { icon: '🚫' },
  failed:  { icon: '❌' },
  error:   { icon: '⚠️' }
};
function showModal(type, title, text){
  if(type === true) type = 'success';
  if(type === false) type = 'failed';
  const preset = MODAL_PRESET[type] || MODAL_PRESET.failed;

  const box = document.getElementById('modalBox');
  box.classList.remove('success','invalid','failed','error');
  box.classList.add(type);

  document.getElementById('modalIcon').textContent = preset.icon;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }

async function apiGet(params){
  const url = APPS_SCRIPT_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  return res.json();
}
async function apiPost(body){
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  return res.json();
}

let citiesCache = [];

async function loadCityDropdown(){
  try{
    const data = await apiGet({ action: 'listSheets' });
    citiesCache = data.sheets || [];
    renderCityDropdown();
  }catch(err){
    console.error('Gagal memuat daftar kota', err);
  }
}
function renderCityDropdown(){
  const sel = document.getElementById('f_kota');
  sel.innerHTML = '';
  citiesCache.forEach(function(c){
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
  const addOpt = document.createElement('option');
  addOpt.value = '__new__'; addOpt.textContent = '+ Tambah kota baru';
  sel.appendChild(addOpt);
}
document.getElementById('f_kota').addEventListener('change', function(e){
  if(e.target.value === '__new__'){
    const newCity = prompt('Nama kota baru:');
    if(newCity && newCity.trim() !== ''){
      citiesCache.push(newCity.trim());
      renderCityDropdown();
      document.getElementById('f_kota').value = newCity.trim();
    } else {
      e.target.value = citiesCache[0] || '';
    }
  }
});

let photoBase64 = '';
document.getElementById('f_gambar').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 500;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      photoBase64 = canvas.toDataURL('image/jpeg', 0.6);
      document.getElementById('photoBox').style.backgroundImage = '';
      document.getElementById('photoBoxText').style.display = 'none';
      let imgTag = document.getElementById('photoPreview');
      if(!imgTag){
        imgTag = document.createElement('img');
        imgTag.id = 'photoPreview';
        document.getElementById('photoBox').appendChild(imgTag);
      }
      imgTag.src = photoBase64;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

document.getElementById('btnSubmit').addEventListener('click', async function(){
  const btn = this;
  const msg = document.getElementById('formMsg');

  const data = {
    gambar: photoBase64,
    linkGambar: val('f_linkGambar'),
    alamat: val('f_alamat'),
    linkMaps: val('f_linkMaps'),
    linkAgent: val('f_linkAgent'),
    summary: val('f_summary'),
    skor: val('f_skor'),
    hargaSewa: val('f_hargaSewa'),
    deposit: val('f_deposit'),
    luasTanah: val('f_luasTanah'),
    lebarBangunan: val('f_lebarBangunan'),
    panjangBangunan: val('f_panjangBangunan'),
    totalLuasBangunan: val('f_totalLuasBangunan'),
    jumlahLantai: val('f_jumlahLantai'),
    kondisiBangunan: val('f_kondisiBangunan'),
    contactAgent: val('f_contactAgent'),
    koordinat: val('f_koordinat'),
    kota: val('f_kota')
  };

  const requiredMap = {
    gambar: 'Foto property', linkGambar: 'Link GDrive gambar', alamat: 'Alamat property',
    linkMaps: 'Link alamat (maps)', linkAgent: 'Link agent property', summary: 'Short summary',
    hargaSewa: 'Harga sewa', contactAgent: 'Contact person agent', koordinat: 'Koordinat lokasi',
    kota: 'Kota'
  };
  const missing = Object.keys(requiredMap).filter(function(k){ return !data[k] || String(data[k]).trim()===''; });
  if(missing.length > 0){
    showModal('invalid', 'Belum lengkap', 'Field berikut wajib diisi: ' + missing.map(function(k){return requiredMap[k];}).join(', '));
    return;
  }

  btn.disabled = true; msg.textContent = 'Mengirim...';
  try{
    const result = await apiPost({ action: 'submitProperty', data: data });
    if(result.success){
      showModal('success', 'Berhasil disimpan', 'Data properti sudah masuk ke spreadsheet.');
      document.querySelectorAll('#page1 input, #page1 textarea').forEach(function(el){ el.value=''; });
      photoBase64 = '';
      const preview = document.getElementById('photoPreview');
      if(preview) preview.remove();
      document.getElementById('photoBoxText').style.display = 'block';
    } else {
      showModal('failed', 'Gagal disimpan', result.error || 'Terjadi kesalahan tidak diketahui.');
    }
  }catch(err){
    showModal('error', 'Gagal terkirim', 'Tidak bisa menghubungi server: ' + err.message);
  }
  btn.disabled = false; msg.textContent = '';
});
function val(id){ return document.getElementById(id).value; }
</script>
</body>
</html>
